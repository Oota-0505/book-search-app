<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ app_name }}</title>
<meta name="description" content="{{ description }}">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{ theme_color }}">

<!-- iOS は manifest の display を読まない。この3つが無いとブラウザUIが残る -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ app_short_name }}">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">

<link rel="preload" as="image" href="/static/images/hero-bg.webp">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body>
<main class="page">

  <header class="hero">
    <div class="hero-heading">
      <!-- viewBox は実際の描画範囲（getBBox 実測: x -0.5, y 25.2, w 59.0, h 42.6）に
           合わせてある。絵より広い viewBox にすると、その空白のぶんだけ
           見出しの文字と縦位置がズレて見える。 -->
      <svg class="hero-icon" viewBox="-2.5 15 63 63" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <filter id="hero-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
          </filter>
          <filter id="hero-glass" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
          </filter>
        </defs>
        <g transform="translate(12, 16) scale(0.75)" filter="url(#hero-shadow)">
          <path d="M 2 15 Q 18 8 32 19 Q 46 8 62 15 L 62 53 Q 46 46 32 57 Q 18 46 2 53 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M 8 50 L 8 53 Q 20 47 32 57 L 32 54 Q 20 44 8 50 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round"/>
          <path d="M 56 50 L 56 53 Q 44 47 32 57 L 32 54 Q 44 44 56 50 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round"/>
          <path d="M 8 16 Q 20 10 32 20 L 32 54 Q 20 44 8 50 Z" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M 56 16 Q 44 10 32 20 L 32 54 Q 44 44 56 50 Z" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
          <line x1="32" y1="20" x2="32" y2="54" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 32 20 L 35 32 L 32 35 L 29 32 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1" stroke-linejoin="round"/>
          <path fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round">
            <animate attributeName="d" dur="2s" repeatCount="indefinite" keyTimes="0;0.2;0.4;0.6;0.8;1" values="M 32 20 Q 44 10 56 16 L 56 50 Q 44 44 32 54 Z;M 32 20 Q 40 6 46 10 L 46 44 Q 40 38 32 54 Z;M 32 20 Q 32 4 32 6 L 32 40 Q 32 36 32 54 Z;M 32 20 Q 24 6 18 10 L 18 44 Q 24 38 32 54 Z;M 32 20 Q 20 10 8 16 L 8 50 Q 20 44 32 54 Z;M 32 20 Q 44 10 56 16 L 56 50 Q 44 44 32 54 Z"/>
            <animate attributeName="opacity" dur="2s" repeatCount="indefinite" keyTimes="0;0.8;0.85;0.95;1" values="1;1;0;0;1"/>
          </path>
        </g>
        <g filter="url(#hero-glass)" transform="translate(-10, 42) scale(0.68)">
          <line x1="14" y1="38" x2="38" y2="14" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
          <circle cx="42" cy="12" r="8" fill="none" stroke="#fff" stroke-width="5.5"/>
          <line x1="14" y1="38" x2="38" y2="14" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
          <circle cx="42" cy="12" r="8" fill="#e0f2fe" fill-opacity="0.9" stroke="#1f2937" stroke-width="2.5"/>
          <path d="M 38 10 A 5 5 0 0 1 41 7" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
      <h1 class="hero-title">{{ app_name }}</h1>
    </div>
    <p class="hero-sub">岐阜の本を、ひとまとめに。</p>
  </header>

  <!-- 図書館から「用意できました」のメールが来た本。JSが /api/pending から埋める -->
  <section class="pending" id="pending" hidden>
    <h2 class="pending-title" id="pending-title"></h2>
    <ul class="pending-list" id="pending-list"></ul>
  </section>

  <nav class="mypage-links" aria-label="マイページ">
    <a class="mypage-link" target="_blank" rel="noopener noreferrer"
       href="https://www1.gifu-lib.jp/winj/opac/login.do?lang=ja&amp;dispatch=/opac/mylibrary.do&amp;every=1">
      🏢 メディコス マイページ
    </a>
    <a class="mypage-link" target="_blank" rel="noopener noreferrer"
       href="https://www.kani-lib.jp">
      🌲 ミライブ マイページ
    </a>
  </nav>

  <section class="search-area">
    <h2 class="section-title">🔍 キーワード入力</h2>

    <form id="search-form" class="search-form" autocomplete="off">
      <input id="keyword" name="q" type="search" class="search-input"
             placeholder="タイトル・著者名などを入力"
             aria-label="検索キーワード" maxlength="120" enterkeyhint="search">

      <!-- 履歴は端末の localStorage に持つ。JSが描画する -->
      <div class="history" id="history" hidden>
        <span class="history-label">🕒 検索履歴:</span>
        <div class="history-chips" id="history-chips"></div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary" id="search-btn">📚 図書館・書店を検索</button>
        <button type="button" class="btn btn-amazon" id="amazon-btn">📦 Amazonで本を探す ↗</button>
      </div>

      <!-- 通知に対応していないブラウザでは JS 側で hidden のままにする -->
      <button type="button" class="btn btn-ghost" id="push-btn" hidden>
        🔔 通知をオンにする
      </button>
    </form>
  </section>

  <hr class="rule">

  <section id="results-area" aria-live="polite"></section>

  <!-- 通知が来ないときの原因切り分け用。実機でしか分からない情報を画面に出す。 -->
  <details class="diag" id="diag" hidden>
    <summary>🔧 通知の診断</summary>
    <dl id="diag-body"></dl>
    <button type="button" class="btn btn-ghost" id="diag-test">
      🔔 この端末にテスト通知を送る
    </button>
    <p class="diag-result" id="diag-result"></p>
  </details>

</main>

<template id="tpl-loading">
  <div class="loading">
    <div class="loading-dots"><i></i><i></i><i></i></div>
    <p class="loading-message">各サイトを検索中...</p>
    <p class="loading-submessage">図書館・書店の在庫を確認しています</p>
  </div>
</template>

<script src="/static/js/app.js?v={{ asset_version }}" defer></script>
</body>
</html>
