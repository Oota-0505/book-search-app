<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログイン — {{ app_name }}</title>
<meta name="theme-color" content="{{ theme_color }}">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: linear-gradient(180deg, #0C0820 0%, #14102A 100%);
        color: #F5F0E8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans",
                     "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    }
    form { display: flex; flex-direction: column; gap: 1rem; width: min(22rem, 100%); text-align: center; }
    img { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto 0.5rem; }
    h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    p.sub { margin: 0 0 0.75rem; color: rgba(245,240,232,0.55); font-size: 0.9rem; }
    input, button {
        font-family: inherit;
        /* 16px 未満だと iOS がフォーカス時に自動ズームする */
        font-size: 1rem;
        padding: 0.9rem 1.1rem;
        border-radius: 14px;
        border: none;
        width: 100%;
    }
    input {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.22);
    }
    input:focus { outline: 2px solid rgba(200,147,62,0.65); outline-offset: 2px; }
    button {
        background: linear-gradient(90deg, #C8933E 0%, #E8B55A 100%);
        color: #120A00;
        font-weight: 900;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(200,147,62,0.35);
    }
    .error {
        margin: 0;
        color: #FCA5A5;
        font-size: 0.9rem;
    }
</style>
</head>
<body>
<form method="post" action="/login">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>{{ app_name }}</h1>
    <p class="sub">岐阜の本を、ひとまとめに。</p>
    {% if error == 1 %}<p class="error">⚠️ パスワードが違います</p>{% endif %}
    {% if error == 2 %}<p class="error">⚠️ 試行回数が多すぎます。5分ほど待ってから再度お試しください</p>{% endif %}
    <input type="password" name="password" placeholder="パスワード"
           autocomplete="current-password" autofocus required>
    <button type="submit">ログイン</button>
</form>
</body>
</html>
